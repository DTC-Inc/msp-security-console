# cargo-about's settings (Dockerfile, "rust-crates.txt"): the licence of every crate linked into the binary, from
# Cargo.lock, for the Linux targets the image is built for. A crate whose licence isn't one of these fails the build.
accepted = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
