# In: only from cloudflared in this namespace (no public ingress). Out: DNS, and HTTPS for the vendors (NinjaOne,
# HaloPSA, NVD, CISA) and the Access certs endpoint (plain NetworkPolicy can't name hosts: the overlay narrows it with the
# cluster's FQDN policy). Nothing else: the store is a file on the pod's own volume. With PostgreSQL, the overlay adds
# egress to the database (5432, narrowed to its address where it can be).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: msp-security-console }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: server } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/component: cloudflared } } }]
      ports: [{ port: 8080 }]
  egress:
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 443, protocol: TCP }]
