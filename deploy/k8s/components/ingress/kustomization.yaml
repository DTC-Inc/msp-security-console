# An Ingress, for AUTH_MODE=oidc or for proxy/trusted_header behind the cluster's own auth proxy (design rev 3.1). With
# trusted_header, set TRUSTED_PROXY_CIDRS to the ingress controller's pod range and narrow the NetworkPolicy to it.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources: [ingress.yaml]
patches:
  - target: { kind: NetworkPolicy, name: msp-security-console }
    patch: |-
      - op: replace
        path: /spec/ingress/0/from
        value: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
